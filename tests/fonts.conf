<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The browser suites measure layout (rows that must stay one row, how high the score starts), and that depends on
     the width of the system UI font. CI points FONTCONFIG_FILE here so system-ui and sans-serif are Inter (Ubuntu's
     fonts-inter), the font the layout was designed and checked with, instead of whatever the runner falls back to. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>
</fontconfig>
